name: Release package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Manual bump before publish (orchestrator normally bumps before merge)"
        required: true
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none

permissions:
  contents: write
  packages: write

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@onlyzoran'

      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Optional manual bump
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: npm version "${{ inputs.bump }}" -m "chore(release): %s"

      - name: Resolve version
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && echo "$COMMIT_MSG" | grep -qiE '\[skip release\]|\[no release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VER="$(node -p "require('./package.json').version")"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

          NAME="$(node -p "require('./package.json').name")"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "Package ${NAME}@${VER} already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse "v${VER}" >/dev/null 2>&1; then
            echo "Tag v${VER} already exists"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Skip release
        if: steps.version.outputs.skip == 'true'
        run: echo "Release skipped"

      - name: Publish to GitHub Packages
        if: steps.version.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Push version commit and tag
        if: steps.version.outputs.skip != 'true'
        run: |
          VER="${{ steps.version.outputs.version }}"
          git push || true
          if ! git rev-parse "v${VER}" >/dev/null 2>&1; then
            git tag "v${VER}"
          fi
          git push origin "v${VER}"
