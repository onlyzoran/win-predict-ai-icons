name: Deploy PR playground preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: pages-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - name: Install and build playground
        if: github.event.action != 'closed'
        env:
          PLAYGROUND_BASE: /win-predict-ai-icons/pr-preview/pr-${{ github.event.number }}/
        run: |
          npm ci
          npm run build:playground

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./playground-dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          wait-for-pages-deployment: true
