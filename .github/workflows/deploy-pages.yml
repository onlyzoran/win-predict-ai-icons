name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build playground
        env:
          PLAYGROUND_BASE: /win-predict-ai-icons/
        run: npm run build:playground
      # clean + clean-exclude: only playground output, keep open PR previews
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: playground-dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview
